<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 110" role="img" aria-label="Corgi chân ngắn, tai lớn">
  <style>
    .leg-a,.leg-c{animation:trot-a .36s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 8%}
    .leg-b,.leg-d{animation:trot-b .36s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 8%}
    .tail{animation:wag .38s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:100% 50%}
    @keyframes trot-a{50%{transform:rotate(16deg) translateY(-2px)}}
    @keyframes trot-b{50%{transform:rotate(-16deg) translateY(-2px)}}
    @keyframes wag{to{transform:rotate(15deg)}}
    @media(prefers-reduced-motion:reduce){.leg-a,.leg-b,.leg-c,.leg-d,.tail{animation:none}}
  </style>
