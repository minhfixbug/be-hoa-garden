<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 165 125" role="img" aria-label="Chó cỏ đen nhỏ, dáng thanh và chân dài">
  <style>
    .leg-a,.leg-c{animation:trot-a .32s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 8%}
    .leg-b,.leg-d{animation:trot-b .32s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 8%}
    .tail{animation:wag .32s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:100% 50%}
    @keyframes trot-a{50%{transform:rotate(23deg) translateY(-3px)}}
    @keyframes trot-b{50%{transform:rotate(-23deg) translateY(-3px)}}
    @keyframes wag{to{transform:rotate(19deg)}}
    @media(prefers-reduced-motion:reduce){.leg-a,.leg-b,.leg-c,.leg-d,.tail{animation:none}}
  </style>
