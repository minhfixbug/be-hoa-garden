    <path class="leg-b" d="M55 58C54 66 55 73 60 75L67 73L67 58Z"/>
    <path class="leg-c" d="M79 57C77 65 79 73 84 75L92 73L92 57Z"/>
    <path class="leg-d" d="M94 55C95 63 97 71 101 73L108 70L106 54Z"/>
  </g>
