<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 88" role="img" aria-label="Bé chó đen nhỏ chạy chơi">
  <style>
    .leg-a,.leg-c{animation:trot-a .31s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 10%}
    .leg-b,.leg-d{animation:trot-b .31s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 10%}
    .tail{animation:wag .3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:100% 50%}
    @keyframes trot-a{50%{transform:rotate(22deg) translateY(-2px)}}
    @keyframes trot-b{50%{transform:rotate(-22deg) translateY(-2px)}}
    @keyframes wag{to{transform:rotate(27deg)}}
    @media(prefers-reduced-motion:reduce){.leg-a,.leg-b,.leg-c,.leg-d,.tail{animation:none}}
  </style>
  <ellipse cx="61" cy="77" rx="49" ry="7" fill="#324f3b" opacity=".2"/>
