<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 96" role="img" aria-label="Bé Corgi chạy chơi">
  <style>
    .leg-a,.leg-c{animation:trot-a .38s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 12%}
    .leg-b,.leg-d{animation:trot-b .38s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 12%}
    .tail{animation:wag .35s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:100% 50%}
    @keyframes trot-a{50%{transform:rotate(19deg) translateY(-2px)}}
    @keyframes trot-b{50%{transform:rotate(-19deg) translateY(-2px)}}
    @keyframes wag{to{transform:rotate(24deg)}}
    @media(prefers-reduced-motion:reduce){.leg-a,.leg-b,.leg-c,.leg-d,.tail{animation:none}}
  </style>
